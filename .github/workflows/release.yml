name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # packages: '' — иначе действие по умолчанию ставит пакет `tools`, а Google его
      # убрал: 15.09 сборка встала на «Failed to find package 'tools'». Платформа и
      # build-tools и так есть в образе ubuntu-latest, действию остаётся принять лицензии.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: chmod +x ./gradlew
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/AutoResponder-$TAG.apk"
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
